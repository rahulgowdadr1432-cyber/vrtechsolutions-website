
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VR Tech Solutions | Admin</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 20px;
      background: #090909; color: #f5f5f5;
      font-family: Arial, sans-serif;
    }
    .container { max-width: 1000px; margin: 30px auto; }
    .card {
      background: #151515; border: 1px solid #b89442;
      border-radius: 14px; padding: 24px; margin-bottom: 20px;
    }
    h1, h2 { color: #d8b45a; }
    input, button {
      width: 100%; padding: 13px; margin: 8px 0;
      border-radius: 7px; font-size: 16px;
    }
    input {
      background: #222; color: white;
      border: 1px solid #555;
    }
    button {
      background: #d8b45a; color: #111;
      border: 0; font-weight: bold; cursor: pointer;
    }
    .secondary { background: #333; color: white; }
    #dashboard { display: none; }
    #message { overflow-wrap: anywhere; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td {
      padding: 11px; border-bottom: 1px solid #444;
      text-align: left; vertical-align: top;
    }
    th { color: #d8b45a; }
    .muted { color: #bbb; }
  </style>
</head>
<body>
<div class="container">
  <h1>VR TECH SOLUTIONS</h1>
  <p class="muted">Secure Admin Dashboard</p>

  <section class="card" id="login">
    <h2>Admin Login</h2>
    <form id="loginForm">
      <input id="email" type="email"
        value="vrtechsolutions24@gmail.com"
        autocomplete="username" required>
      <input id="password" type="password"
        placeholder="Admin password"
        autocomplete="current-password" required>
      <button type="submit">Login</button>
    </form>
  </section>

  <section class="card" id="dashboard">
    <h2>Customer Enquiries</h2>
    <button id="refresh">Refresh Enquiries</button>
    <button id="logout" class="secondary">Logout</button>
    <p id="count">Loading...</p>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Date</th><th>Name</th><th>Phone</th>
            <th>Service</th><th>Message</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>
  <p id="message" role="status"></p>
</div>

<script>
  // Replace both placeholders with your Supabase project details.
  const SUPABASE_URL = "https://ugpqkphnwivnecmjnljo.supabase.co";
  const SUPABASE_KEY = "sb_publishable_F9ecHqri0HHV5CmUA6jZpQ_FCWjTQo0";

  const client = window.supabase.createClient(
    SUPABASE_URL, SUPABASE_KEY
  );

  const login = document.getElementById("login");
  const dashboard = document.getElementById("dashboard");
  const message = document.getElementById("message");

  function showMessage(text) {
    message.textContent = text;
  }

  async function loadEnquiries() {
    showMessage("");
    const { data, error } = await client
      .from("enquiries")
      .select("id, customer_name, phone, service, message, created_at")
      .order("created_at", { ascending: false });

    if (error) {
      showMessage("Enquiries load ಆಗಲಿಲ್ಲ. Database policies ಪರಿಶೀಲಿಸಿ.");
      return;
    }

    const rows = document.getElementById("rows");
    rows.replaceChildren();

    for (const item of data || []) {
      const tr = document.createElement("tr");
      const values = [
        item.created_at
          ? new Date(item.created_at).toLocaleString()
          : "",
        item.customer_name,
        item.phone,
        item.service,
        item.message || ""
      ];

      for (const value of values) {
        const td = document.createElement("td");
        td.textContent = value ?? "";
        tr.appendChild(td);
      }
      rows.appendChild(tr);
    }

    document.getElementById("count").textContent =
      "Total enquiries: " + (data || []).length;
    showMessage("Enquiries updated.");
  }

  async function checkSession() {
    const { data } = await client.auth.getSession();
    if (!data.session) return;

    const { data: admin, error } = await client
      .from("admin_users")
      .select("user_id")
      .eq("user_id", data.session.user.id)
      .maybeSingle();

    if (error || !admin) {
      await client.auth.signOut();
      showMessage("ಈ account ಗೆ Admin permission ಇಲ್ಲ.");
      return;
    }

    login.style.display = "none";
    dashboard.style.display = "block";
    await loadEnquiries();
  }

  document.getElementById("loginForm").addEventListener(
    "submit", async (event) => {
      event.preventDefault();
      showMessage("Login ಪರಿಶೀಲಿಸಲಾಗುತ್ತಿದೆ...");

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      const { error } = await client.auth.signInWithPassword({
        email, password
      });

      if (error) {
        showMessage("Login ವಿಫಲವಾಗಿದೆ. Email, password ಮತ್ತು account ಪರಿಶೀಲಿಸಿ.");
        return;
      }

      await checkSession();
    }
  );

  document.getElementById("refresh").addEventListener(
    "click", loadEnquiries
  );

  document.getElementById("logout").addEventListener(
    "click", async () => {
      await client.auth.signOut();
      dashboard.style.display = "none";
      login.style.display = "block";
      document.getElementById("password").value = "";
      showMessage("Logout ಆಯಿತು.");
    }
  );

  if (
    SUPABASE_URL.includes("PASTE_") ||
    SUPABASE_KEY.includes("PASTE_")
  ) {
    showMessage("ಮೊದಲು ನಿಮ್ಮ Supabase URL ಮತ್ತು Publishable key ಸೇರಿಸಿ.");
  } else {
    checkSession();
  }
</script>
</body>
</html>
