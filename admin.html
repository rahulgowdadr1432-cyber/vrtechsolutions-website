
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VR Tech Solutions | Admin</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 20px;
      background: #090909; color: #f5f5f5;
      font-family: Arial, sans-serif;
    }
    .container { max-width: 1000px; margin: 30px auto; }
    .card {
      background: #151515; border: 1px solid #b89442;
      border-radius: 14px; padding: 24px; margin-bottom: 20px;
    }
    h1, h2 { color: #d8b45a; }
    input, button {
      width: 100%; padding: 13px; margin: 8px 0;
      border-radius: 7px; font-size: 16px;
    }
    input {
      background: #222; color: white;
      border: 1px solid #555;
    }
    button {
      background: #d8b45a; color: #111;
      border: 0; font-weight: bold; cursor: pointer;
    }
    .secondary { background: #333; color: white; }
    #dashboard { display: none; }
    #message { overflow-wrap: anywhere; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td {
      padding: 11px; border-bottom: 1px solid #444;
      text-align: left; vertical-align: top;
    }
    th { color: #d8b45a; }
    .muted { color: #bbb; }
  </style>
</head>
<body>
<div class="container">
  <h1>VR TECH SOLUTIONS</h1>
  <p class="muted">Secure Admin Dashboard</p>

  <section class="card" id="login">
    <h2>Admin Login</h2>
    <form id="loginForm">
      <input id="email" type="email"
        value="vrtechsolutions24@gmail.com"
        autocomplete="username" required>
      <input id="password" type="password"
        placeholder="Admin password"
        autocomplete="current-password" required>
      <button type="submit">Login</button>
    </form>
  </section>

  <section class="card" id="dashboard">
    <h2>Customer Enquiries</h2>
    <button id="refresh">Refresh Enquiries</button>
    <button id="logout" class="secondary">Logout</button>
    <p id="count">Loading...</p>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Date</th><th>Name</th><th>Phone</th>
            <th>Service</th><th>Message</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>
  <p id="message" role="status"></p>
</div>

<script>
  // Replace both placeholders with your Supabase project details.
  const SUPABASE_URL = "https://ugpqkphnwivnecmjnljo.supabase.co";
  const SUPABASE_KEY = "sb_publishable_F9ecHqri0HHV5CmUA6jZpQ_FCWjTQo0";

  const client = window.supabase.createClient(
    SUPABASE_URL, SUPABASE_KEY
  );

  const login = document.getElementById("login");
  const dashboard = document.getElementById("dashboard");
  const message = document.getElementById("message");

  function showMessage(text) {
    message.textContent = text;
  }

  async function loadEnquiries() {
    showMessage("");
    const { data, error } = await client
      .from("enquiries")
      .select("id, customer_name, phone, service, message, created_at")
      .order("created_at", { ascending: false });

    if (error) {
      showMessage("Enquiries load ಆಗಲಿಲ್ಲ. Database policies ಪರಿಶೀಲಿಸಿ.");
      return;
    }

    const rows = document.getElementById("rows");
    rows.replaceChildren();

    for (const item of data || []) {
      const tr = document.createElement("tr");
      const values = [
        item.created_at
          ? new Date(item.created_at).toLocaleString()
          : "",
        item.customer_name,
        item.phone,
        item.service,
        item.message || ""
      ];

      for (const value of values) {
        const td = document.createElement("td");
        td.textContent = value ?? "";
        tr.appendChild(td);
      }
      rows.appendChild(tr);
    }

    document.getElementById("count").textContent =
      "Total enquiries: " + (data || []).length;
    showMessage("Enquiries updated.");
  }

  async function checkSession() {
    const { data } = await client.auth.getSession();
    if (!data.session) return;

    const { data: admin, error } = await client
      .from("admin_users")
      .select("user_id")
      .eq("user_id", data.session.user.id)
      .maybeSingle();

    if (error || !admin) {
      await client.auth.signOut();
      showMessage("ಈ account ಗೆ Admin permission ಇಲ್ಲ.");
      return;
    }

    login.style.display = "none";
    dashboard.style.display = "block";
    await loadEnquiries();
  }

  document.getElementById("loginForm").addEventListener(
    "submit", async (event) => {
      event.preventDefault();
      showMessage("Login ಪರಿಶೀಲಿಸಲಾಗುತ್ತಿದೆ...");

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      const { error } = await client.auth.signInWithPassword({
        email, password
      });

      if (error) {
        showMessage("Login ವಿಫಲವಾಗಿದೆ. Email, password ಮತ್ತು account ಪರಿಶೀಲಿಸಿ.");
        return;
      }

      await checkSession();
    }
  );

  document.getElementById("refresh").addEventListener(
    "click", loadEnquiries
  );

  document.getElementById("logout").addEventListener(
    "click", async () => {
      await client.auth.signOut();
      dashboard.style.display = "none";
      login.style.display = "block";
      document.getElementById("password").value = "";
      showMessage("Logout ಆಯಿತು.");
    }
  );

  if (
    SUPABASE_URL.includes("https://ugpqkphnwivnecmjnljo.supabase.co") ||
    SUPABASE_KEY.includes("sb_publishable_F9ecHqri0HHV5CmUA6jZpQ_FCWjTQo0")
  ) {
    showMessage("");
  } else {
    checkSession();
  }
</script>
<!-- VR Tech Solutions Customer Enquiry Form -->
<section id="enquiry" style="
  background:#111;
  color:#fff;
  padding:30px 20px;
  max-width:650px;
  margin:30px auto;
  border:1px solid #d8b45a;
  border-radius:14px;
  font-family:Arial,sans-serif;
">
  <h2 style="color:#d8b45a;text-align:center">
    Customer Enquiry
  </h2>

  <p style="text-align:center">
    Tell us about your business requirements.
  </p>

  <form id="enquiryForm">
    <label for="customer_name">Your Name</label>
    <input id="customer_name" name="customer_name"
      type="text" maxlength="100" required
      placeholder="Enter your name"
      style="width:100%;padding:12px;margin:8px 0 16px;
      box-sizing:border-box;background:#222;color:#fff;
      border:1px solid #555;border-radius:6px">

    <label for="phone">Mobile Number</label>
    <input id="phone" name="phone"
      type="tel" maxlength="15" required
      pattern="[0-9+() -]{10,15}"
      placeholder="Enter your mobile number"
      style="width:100%;padding:12px;margin:8px 0 16px;
      box-sizing:border-box;background:#222;color:#fff;
      border:1px solid #555;border-radius:6px">

    <label for="service">Select Service</label>
    <select id="service" name="service" required
      style="width:100%;padding:12px;margin:8px 0 16px;
      box-sizing:border-box;background:#222;color:#fff;
      border:1px solid #555;border-radius:6px">
      <option value="">Choose a service</option>
      <option value="Website Development">Website Development</option>
      <option value="Software & IT Services">Software & IT Services</option>
      <option value="Digital Marketing">Digital Marketing</option>
      <option value="Other">Other</option>
    </select>

    <label for="customer_message">Message</label>
    <textarea id="customer_message" name="message"
      maxlength="2000" rows="4"
      placeholder="Describe your requirements"
      style="width:100%;padding:12px;margin:8px 0 16px;
      box-sizing:border-box;background:#222;color:#fff;
      border:1px solid #555;border-radius:6px"></textarea>

    <button id="submitBtn" type="submit"
      style="width:100%;padding:14px;background:#d8b45a;
      color:#111;border:0;border-radius:6px;
      font-weight:bold;font-size:16px">
      Submit Enquiry
    </button>

    <p id="formMessage" role="status" aria-live="polite"></p>
  </form>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(() => {
  const SUPABASE_URL = "https://ugpqkphnwivnecmjnljo.supabase.co";
  const SUPABASE_KEY = "sb_publishable_F9ecHqri0HHV5CmUA6jZpQ_FCWjTQo0";

  const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  const form = document.getElementById("enquiryForm");
  const button = document.getElementById("submitBtn");
  const status = document.getElementById("formMessage");

  form.addEventListener("submit", async (event) => {
    event.preventDefault();

    if (!form.reportValidity()) return;

    button.disabled = true;
    status.textContent = "Submitting your enquiry...";

    const enquiry = {
      customer_name: document.getElementById("customer_name").value.trim(),
      phone: document.getElementById("phone").value.trim(),
      service: document.getElementById("service").value,
      message: document.getElementById("customer_message").value.trim() || null
    };

    try {
      const { error } = await db
        .from("enquiries")
        .insert(enquiry);

      if (error) {
        console.error("Enquiry submission failed:", error);
        status.textContent =
          "Enquiry could not be submitted. Please try WhatsApp or contact us.";
        return;
      }

      status.textContent =
        "Thank you! Your enquiry was submitted successfully.";
      form.reset();

      const text = [
        "New enquiry for VR Tech Solutions",
        "Name: " + enquiry.customer_name,
        "Phone: " + enquiry.phone,
        "Service: " + enquiry.service,
        "Message: " + (enquiry.message || "Not provided")
      ].join("\n");

      const whatsappUrl =
        "https://wa.me/918970240304?text=" + encodeURIComponent(text);

      const link = document.createElement("a");
      link.href = whatsappUrl;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.textContent = "Send enquiry details through WhatsApp";
      link.style.cssText =
        "display:block;margin-top:12px;color:#d8b45a";

      status.appendChild(document.createElement("br"));
      status.appendChild(link);
    } catch (err) {
      console.error(err);
      status.textContent =
        "Connection error. Please try again later.";
    } finally {
      button.disabled = false;
    }
  });
})();
</script>
</body>
</html>
